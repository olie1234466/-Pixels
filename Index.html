<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXELS</title>
<style>
body{margin:0;background:black;color:white;font-family:monospace;text-align:center}
canvas{display:block;margin:auto;border:3px solid white}
button{font-size:18px;padding:10px 20px;margin:10px}
</style>
</head>
<body>

<div id="menu">
  <h1>PIXELS</h1>
  <button onclick="startGame()">PLAY</button>
  <button onclick="openCustomize()">CUSTOMIZE</button>
</div>

<div id="customize" style="display:none">
  <h2>Customize</h2>
  <button onclick="color='lime'">Green</button>
  <button onclick="color='cyan'">Cyan</button>
  <button onclick="color='orange'">Orange</button><br>
  <button onclick="eyes='happy'">Happy Eyes</button>
  <button onclick="eyes='angry'">Angry Eyes</button><br>
  <button onclick="backToMenu()">DONE</button>
</div>

<div id="lose" style="display:none">
  <h2>YOU LOSE</h2>
  <p id="finalScore"></p>
  <button onclick="restart()">RESTART</button>
</div>

<canvas id="game" width="420" height="420" style="display:none"></canvas>

<script>
/* ========= GAME STATE ========= */
let state="menu";

/* ========= CANVAS ========= */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const GROUND=330;
const GRAVITY=0.6;

/* ========= PLAYER ========= */
let color="lime";
let eyes="happy";

const player={
 x:20,y:GROUND-20,w:20,h:20,
 vx:0,vy:0,onGround:true,
 lives:3,score:0,
 attacking:false
};

/* ========= SPIKES ========= */
const spikes=[120,220];

/* ========= INPUT ========= */
let sx=0,sy=0;
canvas.addEventListener("touchstart",e=>{
 sx=e.touches[0].clientX;
 sy=e.touches[0].clientY;
 player.attacking=true;
});
canvas.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-sx;
 let dy=e.changedTouches[0].clientY-sy;

 if(dy<-30 && player.onGround){
  player.vy=-12;
  player.onGround=false;
 }
 if(dx>30)player.vx=5;
 if(dx<-30)player.vx=-5;

 setTimeout(()=>player.attacking=false,150);
});

/* ========= MENUS ========= */
function startGame(){
 document.getElementById("menu").style.display="none";
 canvas.style.display="block";
 state="play";
}

function openCustomize(){
 document.getElementById("menu").style.display="none";
 document.getElementById("customize").style.display="block";
}

function backToMenu(){
 document.getElementById("customize").style.display="none";
 document.getElementById("menu").style.display="block";
}

function restart(){
 document.getElementById("lose").style.display="none";
 player.lives=3;
 player.score=0;
 resetPlayer();
 state="menu";
 document.getElementById("menu").style.display="block";
 canvas.style.display="none";
}

/* ========= LOGIC ========= */
function resetPlayer(){
 player.x=20;player.y=GROUND-20;
 player.vx=0;player.vy=0;
 player.onGround=true;
}

function loseLife(){
 player.lives--;
 resetPlayer();
 if(player.lives<=0){
  state="lose";
  canvas.style.display="none";
  document.getElementById("lose").style.display="block";
  document.getElementById("finalScore").innerText="Score: "+player.score;
 }
}

function update(){
 if(state!=="play")return;

 player.vy+=GRAVITY;
 player.x+=player.vx;
 player.y+=player.vy;

 if(player.y+player.h>=GROUND){
  player.y=GROUND-player.h;
  player.vy=0;
  player.onGround=true;
 }

 spikes.forEach(s=>{
  if(player.x+player.w>s && player.x<s+20 && player.y+player.h>=GROUND){
   loseLife();
  }
  if(player.x>s+20 && !s.done){
   player.score+=50;
   s.done=true;
  }
 });

 if(player.x>canvas.width){
  player.score+=100;
  spikes.forEach(s=>s.done=false);
  resetPlayer();
 }

 player.vx*=0.9;
}

function draw(){
 if(state!=="play")return;

 ctx.fillStyle="black";
 ctx.fillRect(0,0,420,420);

 ctx.fillStyle="#555";
 ctx.fillRect(0,GROUND,420,100);

 ctx.fillStyle="red";
 spikes.forEach(s=>{
  ctx.beginPath();
  ctx.moveTo(s,GROUND);
  ctx.lineTo(s+10,GROUND-20);
  ctx.lineTo(s+20,GROUND);
  ctx.fill();
 });

 ctx.fillStyle=color;
 ctx.fillRect(player.x,player.y,20,20);

 ctx.fillStyle="black";
 if(eyes==="happy"){
  ctx.fillRect(player.x+5,player.y+6,3,3);
  ctx.fillRect(player.x+12,player.y+6,3,3);
 }else{
  ctx.fillRect(player.x+4,player.y+6,4,2);
  ctx.fillRect(player.x+12,player.y+6,4,2);
 }

 if(player.attacking){
  ctx.fillStyle="white";
  ctx.fillRect(player.x+20,player.y+8,12,4);
 }

 ctx.fillStyle="white";
 ctx.fillText("Score: "+player.score,10,20);
 ctx.fillText("Lives: "+player.lives,10,40);
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
