<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXELS</title>
<style>
body{margin:0;background:black;color:white;font-family:monospace}
canvas{display:block;margin:auto;border:3px solid white}
</style>
</head>
<body>

<canvas id="game" width="420" height="420"></canvas>

<script>
/* ===================== SETUP ===================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GROUND = 320;
const GRAVITY = 0.6;

let state = "menu"; // menu | shop | play | lose

/* ===================== PLAYER ===================== */
const player = {
  x:20,y:GROUND-20,w:20,h:20,
  vx:0,vy:0,onGround:true,
  lives:3,score:0,
  attacking:false
};

/* ===================== SWORDS ===================== */
let sword = "normal";
const swords = {
  normal:{range:12,color:"white"},
  long:{range:22,color:"white"},
  fire:{range:16,color:"orange"}
};

/* ===================== SPIKES ===================== */
const spikePositions = [120,220];
let passedSpikes = new Set();

/* ===================== MONSTERS ===================== */
let monsters = [];

function spawnMonsters(){
  monsters = [
    {x:260,y:GROUND-20,w:20,h:20,type:"walker",dir:-1,dead:false},
    {x:180,y:GROUND-80,w:20,h:20,type:"flyer",dir:1,dead:false}
  ];
}

/* ===================== INPUT ===================== */
let sx=0, sy=0;

canvas.addEventListener("touchstart",e=>{
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;

  if(state==="play") player.attacking = true;
});

canvas.addEventListener("touchend",e=>{
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;

  if(state==="menu"){
    if(sx < canvas.width/2) state="play";
    else state="shop";
    resetGame();
  }

  else if(state==="shop"){
    if(sy < 160) sword="normal";
    else if(sy < 220) sword="long";
    else sword="fire";
    state="menu";
  }

  else if(state==="play"){
    if(dy < -30 && player.onGround){
      player.vy = -12;
      player.onGround = false;
    }
    if(dx > 30) player.vx = 5;
    if(dx < -30) player.vx = -5;
    setTimeout(()=>player.attacking=false,120);
  }

  else if(state==="lose"){
    state="menu";
    resetGame();
  }
});

/* ===================== HELPERS ===================== */
function rectHit(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y;
}

function resetPlayer(){
  player.x=20;
  player.y=GROUND-20;
  player.vx=0;
  player.vy=0;
  player.onGround=true;
}

function resetGame(){
  player.lives=3;
  player.score=0;
  passedSpikes.clear();
  spawnMonsters();
  resetPlayer();
}

function loseLife(){
  player.lives--;
  resetPlayer();
  passedSpikes.clear();
  spawnMonsters();
  if(player.lives<=0){
    state="lose";
  }
}

/* ===================== UPDATE ===================== */
function update(){
  if(state!=="play") return;

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  if(player.y+player.h >= GROUND){
    player.y = GROUND-player.h;
    player.vy = 0;
    player.onGround = true;
  }

  // Spikes
  spikePositions.forEach((x,i)=>{
    if(player.x+player.w>x && player.x<x+20 && player.y+player.h>=GROUND){
      loseLife();
    }
    if(player.x > x+20 && !passedSpikes.has(i)){
      passedSpikes.add(i);
      player.score += 50;
    }
  });

  // Monsters
  monsters.forEach(m=>{
    if(m.dead) return;

    if(m.type==="walker"){
      m.x += m.dir*1.2;
      if(m.x<140||m.x>330) m.dir*=-1;
    }
    if(m.type==="flyer"){
      m.y += m.dir*1.2;
      if(m.y<GROUND-120||m.y>GROUND-60) m.dir*=-1;
    }

    if(rectHit(player,m)){
      loseLife();
    }

    if(player.attacking){
      const swordBox = {
        x:player.x+player.w,
        y:player.y,
        w:swords[sword].range,
        h:player.h
      };
      if(rectHit(swordBox,m)){
        m.dead=true;
        player.score+=100;
      }
    }
  });

  if(player.x > canvas.width){
    player.score += 100;
    passedSpikes.clear();
    spawnMonsters();
    resetPlayer();
  }

  player.vx *= 0.9;
}

/* ===================== DRAW ===================== */
function drawPixelText(text,x,y,scale){
  const map={
    P:["111","101","111","100","100"],
    I:["111","010","010","010","111"],
    X:["101","010","010","010","101"],
    E:["111","100","110","100","111"],
    L:["100","100","100","100","111"],
    S:["111","100","111","001","111"]
  };
  let cx=x;
  for(let ch of text){
    const g=map[ch];
    for(let r=0;r<g.length;r++){
      for(let c=0;c<g[r].length;c++){
        if(g[r][c]==="1")
          ctx.fillRect(cx+c*scale,y+r*scale,scale,scale);
      }
    }
    cx+=g[0].length*scale+scale;
  }
}

function draw(){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,420,420);

  if(state==="menu"){
    ctx.fillStyle="lime";
    drawPixelText("PIXELS",60,80,10);
    ctx.fillStyle="white";
    ctx.fillText("LEFT TAP: PLAY",140,260);
    ctx.fillText("RIGHT TAP: SHOP",135,290);
    return;
  }

  if(state==="shop"){
    ctx.fillText("SWORD SHOP",150,80);
    ctx.fillText("TOP: Normal",150,150);
    ctx.fillText("MID: Long",150,200);
    ctx.fillText("BOT: Fire",150,250);
    return;
  }

  if(state==="lose"){
    ctx.fillText("YOU LOSE",160,180);
    ctx.fillText("Score: "+player.score,150,210);
    ctx.fillText("Tap to return",135,260);
    return;
  }

  // Game
  ctx.fillStyle="#555";
  ctx.fillRect(0,GROUND,420,100);

  // Spikes
  ctx.fillStyle="red";
  spikePositions.forEach(x=>{
    ctx.beginPath();
    ctx.moveTo(x,GROUND);
    ctx.lineTo(x+10,GROUND-20);
    ctx.lineTo(x+20,GROUND);
    ctx.fill();
  });

  // Monsters
  ctx.fillStyle="purple";
  monsters.forEach(m=>{
    if(!m.dead) ctx.fillRect(m.x,m.y,m.w,m.h);
  });

  // Player
  ctx.fillStyle="lime";
  ctx.fillRect(player.x,player.y,20,20);

  // Sword
  if(player.attacking){
    ctx.fillStyle=swords[sword].color;
    ctx.fillRect(player.x+20,player.y+8,swords[sword].range,4);
  }

  // HUD
  ctx.fillStyle="white";
  ctx.fillText("Score: "+player.score,10,20);
  ctx.fillText("Lives: "+player.lives,10,40);
}

/* ===================== LOOP ===================== */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
